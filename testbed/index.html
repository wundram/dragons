<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dragons — Test Bed Harness</title>

  <!-- Import map: pin Three.js + addons from a CDN so there is ZERO build step.
       If you are offline, vendor these files into testbed/vendor/ and repoint the
       map (see testbed/README.md → "Offline"). Pinned to r0.160.0. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <style>
    :root {
      --bg: #131922; --panel: #1c2530; --panel2: #232f3d;
      --ink: #e7eef7; --muted: #93a4b8; --accent: #ffb454; --line: #33465c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font: 13px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--ink); background: var(--bg); overflow: hidden;
    }
    #app { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }

    /* ---- left control column ---- */
    #panel {
      background: var(--panel); border-right: 1px solid var(--line);
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }
    #panelHead { padding: 12px 14px; border-bottom: 1px solid var(--line); }
    #panelHead h1 { font-size: 14px; margin: 0 0 8px; letter-spacing: .3px; }
    #panelHead .sub { color: var(--muted); font-size: 11px; margin-bottom: 10px; }

    .age-wrap { background: var(--panel2); border: 1px solid var(--accent);
      border-radius: 8px; padding: 8px 10px; }
    .age-wrap label { display: flex; justify-content: space-between;
      font-weight: 600; color: var(--accent); margin-bottom: 4px; }
    .age-wrap .hint { color: var(--muted); font-weight: 400; font-size: 10px; }

    #controls { flex: 1; overflow-y: auto; padding: 8px 12px 20px; }
    .group { margin-top: 12px; }
    .group h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .6px;
      color: var(--muted); margin: 8px 0 6px; border-bottom: 1px solid var(--line);
      padding-bottom: 3px; }
    .row { display: grid; grid-template-columns: 92px 1fr 40px; align-items: center;
      gap: 8px; margin: 3px 0; }
    .row label { color: var(--ink); font-size: 11px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; cursor: help; }
    .row .val { color: var(--muted); font-variant-numeric: tabular-nums;
      text-align: right; font-size: 11px; }

    input[type=range] { width: 100%; accent-color: var(--accent); }

    /* ---- buttons / actions ---- */
    #actions { padding: 10px 12px; border-top: 1px solid var(--line);
      display: flex; flex-wrap: wrap; gap: 6px; background: var(--panel); }
    button, select {
      background: var(--panel2); color: var(--ink); border: 1px solid var(--line);
      border-radius: 6px; padding: 6px 9px; font-size: 11px; cursor: pointer;
    }
    button:hover, select:hover { border-color: var(--accent); }
    #actions .row2 { display: flex; gap: 6px; width: 100%; align-items: center; }
    #actions .row2 label { color: var(--muted); font-size: 11px; }

    #readoutWrap { padding: 0 12px 10px; }
    #readout { width: 100%; height: 120px; background: #0f141b; color: #a9d4a0;
      border: 1px solid var(--line); border-radius: 6px; font: 11px/1.4 ui-monospace,
      Menlo, monospace; resize: vertical; padding: 8px; }

    /* ---- right stage ---- */
    #stage { position: relative; }
    #view { width: 100%; height: 100%; display: block; }
    #hud { position: absolute; left: 12px; bottom: 10px; color: var(--muted);
      font-size: 11px; background: rgba(0,0,0,.35); padding: 4px 8px; border-radius: 6px; }
    #err { position: absolute; inset: 12px 12px auto 12px; background: #4a1f1f;
      color: #ffd7d7; border: 1px solid #a33; border-radius: 8px; padding: 10px 12px;
      font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; display: none; }

    /* ---- Skin & View / Gallery groups ---- */
    .emotion-row { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
    .emotion-row label { color: var(--muted); font-size: 11px; }
    .emotion-row select { flex: 1; }
    .row.chk { grid-template-columns: 92px 1fr; }
    .row.wide { grid-template-columns: 1fr; }
    .row.dim { opacity: .4; }
    .row select { width: 100%; }
    .grp-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .grp-btns button { flex: 1; }

    /* ---- in-browser gallery overlay ---- */
    #gallery { position: absolute; inset: 0; z-index: 20; display: none;
      flex-direction: column; background: rgba(15,20,27,.97); }
    #galleryBar { display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border-bottom: 1px solid var(--line); }
    #galleryTitle { font-size: 13px; margin: 0; color: var(--accent); font-weight: 600; }
    #galleryStatus { color: var(--muted); font-size: 11px; font-weight: 400; }
    #galleryGrid { flex: 1; overflow: auto; padding: 14px; }
    .galRow { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
      margin-bottom: 14px; }
    .galCell { margin: 0; background: var(--panel2); border: 1px solid var(--line);
      border-radius: 8px; padding: 6px; width: 200px; }
    .galCell img { width: 100%; height: 180px; object-fit: contain; display: block;
      background: #14141c; border-radius: 4px; }
    .galCell figcaption { text-align: center; color: var(--muted); font-size: 11px;
      margin-top: 4px; }
  </style>
</head>
<body>
  <div id="app">
    <!-- LEFT: controls -->
    <div id="panel">
      <div id="panelHead">
        <h1>🐲 Dragons Test Bed</h1>
        <div class="sub">Scrub <b>Age</b> to watch the cute→cool arc. Tune traits below.</div>
        <div class="age-wrap">
          <label>AGE <span id="ageVal">0.00</span></label>
          <input id="age" type="range" min="0" max="1" step="0.005" value="0" />
          <div class="hint">0 = cute baby · 1 = cool adult</div>
        </div>
        <!-- Emotion lives here (right under AGE) so it stays the FIRST <select>
             in the document — render.mjs --emotion targets querySelector('select'). -->
        <div class="emotion-row">
          <label for="emotion">Emotion</label>
          <select id="emotion"></select>
          <button id="btnCopy" title="Copy genome JSON">⧉ Copy</button>
        </div>
      </div>

      <div id="controls">
        <!-- Skin & View: capabilities that used to be console/CLI-only. -->
        <section class="group">
          <h3>Skin &amp; View</h3>
          <div class="row">
            <label title="Body skinning method">Skin mode</label>
            <select id="skinMode">
              <option value="smooth">Smooth</option>
              <option value="capsule">Capsule</option>
              <option value="voxel">Voxel (Minecraft)</option>
            </select>
            <span></span>
          </div>
          <div class="row" id="voxelResRow">
            <label title="Voxel grid resolution (only used in Voxel mode)">Voxel res</label>
            <input id="voxelRes" type="range" min="12" max="40" step="1" value="24" />
            <span class="val" id="voxelResVal">24</span>
          </div>
          <div class="row chk">
            <label title="Overlay the bone rig">Show rig</label>
            <input id="showRig" type="checkbox" />
          </div>
          <div class="row">
            <label title="Load an archetype genome into the live sliders">Archetype</label>
            <select id="archetype">
              <option value="custom">Custom</option>
              <option value="snake">Snake</option>
              <option value="drake">Drake (walker)</option>
              <option value="wyvern">Wyvern (flyer)</option>
              <option value="crawlerFlyer">Crawler-flyer</option>
              <option value="grasper">Grasper</option>
              <option value="eastern">Eastern</option>
            </select>
            <span></span>
          </div>
          <div class="row wide">
            <button id="btnExportGeo" title="Download the current dragon as a Bedrock geo.json">⬇ Export geo.json</button>
          </div>
        </section>
        <!-- Gallery: batch-render thumbnails with the single renderer. -->
        <section class="group">
          <h3>Gallery</h3>
          <div class="grp-btns">
            <button id="btnGalAge">Age strip</button>
            <button id="btnGalVar">Variation</button>
            <button id="btnGalTree">Breeding tree</button>
          </div>
        </section>
        <!-- genome sliders injected from GENOME_SCHEMA below -->
      </div>

      <div id="actions">
        <button id="btnRandom">🎲 Randomize</button>
        <button id="btnReset">↺ Reset</button>
        <button id="btnExport">⬇ glTF</button>
        <button id="btnShot">📷 PNG</button>
      </div>
      <div id="readoutWrap">
        <textarea id="readout" readonly spellcheck="false"></textarea>
      </div>
    </div>

    <!-- RIGHT: 3D stage -->
    <div id="stage">
      <canvas id="view"></canvas>
      <div id="hud">drag = orbit · scroll = zoom · right-drag = pan</div>
      <div id="err"></div>
      <!-- In-browser gallery overlay (thumbnail grid over the 3D stage). -->
      <div id="gallery">
        <div id="galleryBar">
          <h2 id="galleryTitle">Gallery <span id="galleryStatus"></span></h2>
          <button id="galleryClose">✕ Close</button>
        </div>
        <div id="galleryGrid"></div>
      </div>
    </div>
  </div>

  <!-- Surface module load / runtime errors in-page so headless verification and
       humans both see failures without opening devtools. -->
  <script>
    window.addEventListener('error', (e) => {
      const el = document.getElementById('err');
      if (el) { el.style.display = 'block';
        el.textContent = 'Error: ' + (e.message || e.error) + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''); }
    });
    window.addEventListener('unhandledrejection', (e) => {
      const el = document.getElementById('err');
      if (el) { el.style.display = 'block';
        el.textContent = 'Load error (often CDN/offline): ' + (e.reason && e.reason.message || e.reason); }
    });
  </script>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
